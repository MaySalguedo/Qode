<ion-header>
	<ion-toolbar>
		<ion-title>Authorize Divice</ion-title>
		<ion-buttons slot="end">
			<ion-button (click)="dismiss()">Close</ion-button>
		</ion-buttons>
	</ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">
	<div class="modal-container">
		<p>Enter this code on the GitHub page to authorize your account:</p>
		
		<div class="code-box" (click)="copyCode()">
			<h2 class="verification-code">{{ userCode }}</h2>
			<ion-note color="medium">Tab to copie</ion-note>
		</div>

		<ion-button expand="block" mode="ios" (click)="openGitHub()" class="ion-margin-top">
			<ion-icon slot="start" name="open-outline"></ion-icon>
			Open Github Page
		</ion-button>

		<div class="loading-status ion-margin-top">
			<ion-spinner name="dots"></ion-spinner>
			<p>Waiting Authorization</p>
		</div>
	</div>
</ion-content>
