<ion-header class="ion-no-border">
	<ion-toolbar>
		<ion-title>Practices</ion-title>
		<ion-buttons slot="end">
			<ion-button (click)="addPractice()" fill="clear">
				<ion-icon name="add-circle-outline" slot="icon-only"></ion-icon>
			</ion-button>
		</ion-buttons>
	</ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
	@for (section of groupedSections; track section.category) {
		<app-best-practices-items
			[section]="section"
			[selectedIds]="selectedIds"
			(toggleOption)="toggleOption($event)"
			(viewGist)="onViewGist($event)">
		</app-best-practices-items>
	}
</ion-content>

<ion-footer class="ion-no-border">
	<ion-toolbar>
		<div class="footer-actions ion-padding-horizontal">
			<ion-button expand="block" color="danger" (click)="deletePractice()" [disabled]="selectedIds.size === 0">
				<ion-icon name="trash-outline" slot="start"></ion-icon>
				Delete Selected
			</ion-button>
			<ion-button expand="block" (click)="editPractice()" [disabled]="selectedIds.size !== 1">
				<ion-icon name="pencil-outline" slot="start"></ion-icon>
				Edit Selected
			</ion-button>
		</div>
	</ion-toolbar>
</ion-footer>
