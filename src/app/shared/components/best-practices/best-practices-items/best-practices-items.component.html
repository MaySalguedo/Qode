<div class="category-block">
	<h2 class="category-title">{{ section.category | uppercase }}</h2>
	
	@for (sub of section.subGroups; track sub.name) {
		<ion-item-group class="sub-group">
			<ion-list-header>
				<ion-label>{{ sub.name }}</ion-label>
			</ion-list-header>

			@for (item of sub.items; track item.id) {
				<ion-item [class.selected]="isSelected(item.id)" (click)="onToggle(item.id)" button detail="false">

					<ion-icon [name]="item.icon" slot="start" class="option-icon"></ion-icon>
					
					<ion-label>
						<h3>{{ item.name }}</h3>
						<p>{{ item.description }}</p>
					</ion-label>

					@if (item.gist) {
						<ion-button slot="end" fill="clear" (click)="onViewGist(item); $event.stopPropagation()">
							<ion-icon name="eye-outline"></ion-icon>
						</ion-button>
					}

					<ion-checkbox slot="end" [checked]="isSelected(item.id)"></ion-checkbox>
				</ion-item>
			}
		</ion-item-group>
	}
</div>
